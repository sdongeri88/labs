name: CI

on:
  push:
    branches: [ main, 'feature/**' ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Отримати код
        uses: actions/checkout@v6

      - name: Установити .NET 8 і 10
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: |
            8.0.x
            10.0.x

      - name: Відновити залежності
        run: dotnet restore

      - name: Перевірка форматування
        run: dotnet format --verify-no-changes --no-restore

      - name: Правила стандарту поза аналізаторами
        shell: pwsh
        run: ./tools/check-style.ps1

      - name: Складання Release з аналізаторами
        run: dotnet build -c Release --no-restore

      - name: Тести й покриття
        run: >
          dotnet test -c Release --no-restore
          /p:CollectCoverage=true
          /p:CoverletOutputFormat=cobertura
          /p:Threshold=60 /p:ThresholdType=line

      - name: Зберегти звіт про покриття
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: coverage
          path: '**/coverage.cobertura.xml'
          retention-days: 14
