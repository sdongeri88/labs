name: CI

on:
  push:
    branches: [ main, 'feature/**', ci-demo ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # 1. Отримання коду й встановлення .NET 8
      - name: Отримати код
        uses: actions/checkout@v6

      - name: Установити .NET 8 і 10
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: |
            8.0.x
            10.0.x

      # 2. Пакет не завантажується — збірка падає
      - name: Відновити залежності
        run: dotnet restore

      # 3. Будь-яке відхилення від .editorconfig зупиняє конвеєр
      - name: Перевірка форматування
        run: dotnet format --verify-no-changes --no-restore

      - name: Правила стандарту поза аналізаторами
        shell: pwsh
        run: ./tools/check-style.ps1

      # 4. Жодного попередження аналізаторів
      - name: Складання Release з -warnaserror
        run: dotnet build -c Release --no-restore -warnaserror

      # 5. Жодного червоного тесту; покриття збирає coverlet
      - name: Тести й збирання покриття
        run: >
          dotnet test -c Release --no-build
          /p:CollectCoverage=true
          /p:CoverletOutputFormat=cobertura
          /p:Threshold=60 /p:ThresholdType=line

      # 6. Покриття бібліотеки логіки нижче за 70 % — конвеєр падає
      - name: Поріг покриття бібліотеки логіки (70 %)
        shell: pwsh
        run: ./tools/check-coverage.ps1 -Min 70

      # 7. Звіт можна завантажити з інтерфейсу GitHub
      - name: Зберегти звіт про покриття
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: coverage
          path: '**/coverage.cobertura.xml'
          retention-days: 14
